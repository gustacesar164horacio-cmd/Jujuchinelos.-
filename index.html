<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6a6c8">
<title>Jujuchinelos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#fff8fb;color:#352b31;padding-bottom:78px}
button{border:0;cursor:pointer;font:inherit}
header{background:linear-gradient(135deg,#f8b5d0,#e8a9f0);padding:20px 18px 24px;border-radius:0 0 26px 26px;color:white}
.brand{font-size:27px;font-weight:800}.subtitle{margin-top:5px;opacity:.9}
.search{margin-top:16px;background:white;border-radius:14px;padding:12px 15px;color:#777;width:100%;border:0;outline:0}
main{max-width:900px;margin:auto;padding:18px}
.banner{background:#fff0f7;border-radius:20px;padding:20px;margin-bottom:20px}
.banner h2{font-size:22px;margin-bottom:7px}.banner p{color:#725d67}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}
.section-title h2{font-size:20px}
.categories{display:flex;gap:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px}
.categories button{white-space:nowrap;background:white;border:1px solid #f0d7e3;padding:10px 15px;border-radius:20px;color:#6d5360;flex-shrink:0}
.categories button.active{background:#edacd0;color:white;border-color:#edacd0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.card{background:white;border-radius:18px;padding:10px;box-shadow:0 4px 16px #d9b8c533;position:relative;overflow:hidden}
.product-img{height:145px;border-radius:14px;background:#f9e6ef;display:flex;align-items:center;justify-content:center;color:#b5839b;font-weight:bold;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:15px;margin:10px 2px 5px}.price{font-size:18px;font-weight:800;color:#d45d9b}
.old{text-decoration:line-through;color:#999;font-size:12px;margin-right:5px}

/* BOTÕES DE AÇÃO COMPACTOS */
.actions{display:flex;gap:5px;margin-top:8px}
.buy,.add{flex:1;padding:6px 8px;border-radius:8px;font-size:12px;font-weight:bold}
.buy{background:#e889b7;color:white}
.add{background:#fff0f7;color:#c9568d;border:1px solid #f0d7e3}

.empty{text-align:center;padding:45px 15px;color:#8a737e}

/* BARRA INFERIOR */
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:white;border-top:1px solid #efdce5;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom button{background:white;color:#806875;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;height:100%}
.bottom button.active{color:#d45d9b;font-weight:bold}.icon{font-size:21px}
.badge{background:#df5d98;color:white;border-radius:20px;padding:2px 7px;font-size:10px;margin-left:4px}

.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}.sheet{background:white;width:100%;max-height:90vh;overflow-y:auto;border-radius:25px 25px 0 0;padding:22px}
.close{float:right;background:#f5e9ee;border-radius:50%;width:34px;height:34px}
.form input,.form select{width:100%;padding:13px;margin:7px 0;border:1px solid #ead7df;border-radius:12px;outline:none}
.full{width:100%;padding:12px;border-radius:13px;background:#e889b7;color:white;margin-top:10px;font-size:14px;font-weight:bold}
.cart-row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0e3e8;padding:12px 0}
.cart-thumb{width:58px;height:58px;border-radius:12px;background:#f9e6ef;display:flex;align-items:center;justify-content:center;font-size:10px}
.qty{display:flex;gap:8px;align-items:center;margin-left:auto}.qty button{width:28px;height:28px;border-radius:8px;background:#f8e8ef}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;margin-top:18px}
.hidden{display:none}

/* TOAST (NOTIFICAÇÃO) */
.toast-notification {
  position: fixed;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #352b31;
  color: white;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  z-index: 100;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast-notification.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* Estilos Admin */
.admin-card{background:white;padding:15px;border-radius:15px;margin-bottom:12px;border:1px solid #f0d7e3;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-actions{display:flex;gap:6px}
.btn-edit{background:#7eb0d5;color:white;padding:8px 12px;border-radius:8px;font-size:12px}
.btn-danger{background:#ff6b6b;color:white;padding:8px 12px;border-radius:8px;font-size:12px}
.checkbox-label{display:flex;align-items:center;gap:8px;margin:10px 0;color:#6d5360}
.preview-img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin:10px 0;display:none;border:1px dashed #e0c8d5}
.tag-item{display:inline-flex;align-items:center;gap:8px;background:#f5e5ed;color:#806875;padding:6px 12px;border-radius:15px;margin:4px;font-size:13px}
.tag-item button{background:none;color:#ff6b6b;font-weight:bold;font-size:14px}

@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.product-img{height:180px}.modal{align-items:center}.sheet{max-width:550px;border-radius:25px}}
</style>
</head>
<body>
<header>
  <div class="brand">Jujuchinelos</div>
  <div class="subtitle">Chinelos, cabedais e acessórios</div>
  <input id="search" class="search" placeholder="🔎 Procurar produto..." oninput="render()">
</header>

<main>
  <section id="home">
    <div class="banner">
      <h2>✨ Encontre seu favorito!</h2>
      <p>Confira nosso catálogo e aproveite as promoções.</p>
    </div>
    <div class="section-title"><h2>Destaques</h2></div>
    <div id="homeGrid" class="grid"></div>
  </section>

  <section id="catalog" class="hidden">
    <div class="section-title"><h2>Catálogo</h2></div>
    <div id="categoriesBar" class="categories"></div>
    <div id="catalogGrid" class="grid" style="margin-top:15px"></div>
  </section>

  <section id="promo" class="hidden">
    <div class="section-title"><h2>🔥 Promoções</h2></div>
    <div id="promoGrid" class="grid"></div>
  </section>

  <section id="cart" class="hidden">
    <div class="section-title"><h2>🛒 Meu carrinho</h2></div>
    <div id="cartContent"></div>
  </section>

  <section id="admin" class="hidden">
    <div class="section-title"><h2>⚙ Painel de Controle</h2></div>
    
    <div id="adminLoginView" class="banner">
      <h2>Acesso Restrito</h2>
      <p style="margin-bottom:10px">Digite a senha de administrador para gerenciar o catálogo.</p>
      <input type="password" id="adminPass" class="search" placeholder="Senha do painel" style="border:1px solid #e0c8d5">
      <button class="full" style="margin-top:10px" onclick="loginAdmin()">Entrar no Painel</button>
    </div>

    <div id="adminPanel" class="hidden">
      <div style="margin-bottom:15px;background:#fff;padding:12px;border-radius:12px;border:1px solid #f0d7e3">
        <label style="font-size:12px;color:#806875;font-weight:bold">📱 WhatsApp para Pedidos (com DDD):</label>
        <input id="storePhoneInput" class="search" style="margin-top:5px;border:1px solid #e0c8d5" placeholder="Ex: 5519992935485">
        <button class="full" style="margin-top:8px;padding:8px" onclick="saveStorePhone()">Salvar WhatsApp</button>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:20px">
        <button class="full" onclick="openAddProductModal()" style="margin-top:0">+ Novo Produto</button>
        <button class="full" onclick="openManageCategoriesModal()" style="margin-top:0;background:#7eb0d5">🏷️️ Categorias</button>
      </div>
      <div id="adminProductList"></div>
    </div>
  </section>
</main>

<nav class="bottom">
  <button class="active" onclick="showPage('home',this)"><span class="icon">🏠</span>Início</button>
  <button onclick="showPage('catalog',this)"><span class="icon">🛍️</span>Catálogo</button>
  <button onclick="showPage('promo',this)"><span class="icon">🔥</span>Promoções</button>
  <button onclick="showPage('cart',this)"><span class="icon">🛒</span>Carrinho <span id="cartBadge" class="badge">0</span></button>
  <button onclick="showPage('admin',this)"><span class="icon">⚙️</span>Admin</button>
</nav>

<div id="toast" class="toast-notification"></div>

<div id="productModal" class="modal" onclick="if(event.target===this)closeModal()">
 <div class="sheet">
   <button class="close" onclick="closeModal()">✕</button>
   <div id="productDetail"></div>
 </div>
</div>

<script>
const ADMIN_PASSWORD = "juju2026";
let storePhone = localStorage.getItem("jujuchinelos_phone") || "5519992935485";
const initialCategories = ["Chinelos", "Cabedais", "Pingentes", "Acessórios"];

const initialProducts = [
 {id:1,name:"Chinelo Básico",cat:"Chinelos",price:25,img:"",promo:true,old:30},
 {id:2,name:"Cabedal Floral",cat:"Cabedais",price:15,img:"",promo:false},
 {id:3,name:"Pingente Coração",cat:"Pingentes",price:8,img:"",promo:true,old:10},
 {id:4,name:"Cabedal Luxo",cat:"Cabedais",price:20,img:"",promo:false},
 {id:5,name:"Chinelo Decorado",cat:"Chinelos",price:35,img:"",promo:true,old:40},
 {id:6,name:"Pingente Estrela",cat:"Pingentes",price:7,img:"",promo:false},
 {id:7,name:"Kit Acessórios",cat:"Acessórios",price:18,img:"",promo:true,old:22},
 {id:8,name:"Acessório para Chinelo",cat:"Acessórios",price:10,img:"",promo:false}
];

let categories = JSON.parse(localStorage.getItem("jujuchinelos_categories")) || initialCategories;
let products = JSON.parse(localStorage.getItem("jujuchinelos_products")) || initialProducts;
let cart = JSON.parse(localStorage.getItem("jujuchinelos_cart")||"[]");
let category = "Todos";
let isAdminLoggedIn = false;
let currentImageData = "";

function showNotification(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  }, 2500);
}

function saveProducts(){
  localStorage.setItem("jujuchinelos_products", JSON.stringify(products));
  render();
  if(isAdminLoggedIn) renderAdminList();
}

function saveCategories(){
  localStorage.setItem("jujuchinelos_categories", JSON.stringify(categories));
  renderCategoriesBar();
  render();
}

function saveStorePhone(){
  const val = document.getElementById("storePhoneInput").value.replace(/\D/g, "");
  if(!val){
    showNotification("Digite o número do WhatsApp com DDD.");
    return;
  }
  storePhone = val;
  localStorage.setItem("jujuchinelos_phone", val);
  showNotification("WhatsApp atualizado com sucesso! ✅");
}

function money(v){return "R$ "+Number(v).toFixed(2).replace(".",",")}

// FUNÇÃO ATUALIZADA PARA ABRIR O APLICATIVO DIRETO
function openWhatsAppDirectly(messageText){
  const encodedText = encodeURIComponent(messageText);
  // Usa o esquema app-native (whatsapp://) com fallback para o link HTTPS se estiver no PC
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile) {
    window.location.href = `whatsapp://send?phone=${storePhone}&text=${encodedText}`;
  } else {
    window.open(`https://api.whatsapp.com/send?phone=${storePhone}&text=${encodedText}`, "_blank");
  }
}

function buyDirectly(event, productId){
  if(event) event.preventDefault();
  const p = products.find(x => x.id === productId);
  if(!p) return;
  
  let imgMessage = "";
  if(p.img && p.img.startsWith("http")){
    imgMessage = `\nFoto do produto: ${p.img}`;
  }
  
  const text = `Olá! Tenho interesse no produto:\n\n*${p.name}*\nPreço: ${money(p.price)}${imgMessage}\n\nGostaria de finalizar a compra!`;
  openWhatsAppDirectly(text);
}

function card(p){
 const image=p.img?`<img src="${p.img}" alt="${p.name}">`:`<span>Foto do produto</span>`;
 return `<div class="card">
   <div class="product-img">${image}</div>
   <h3>${p.name}</h3>
   ${p.promo?`<div><span class="old">${money(p.old)}</span><span class="price">${money(p.price)}</span></div>`:`<div class="price">${money(p.price)}</div>`}
   <div class="actions">
    <button class="buy" onclick="buyDirectly(event, ${p.id})">Comprar</button>
    <button class="add" onclick="addCart(event, ${p.id})">+ Carrinho</button>
   </div>
 </div>`;
}

function filtered(){
 const q=document.getElementById("search").value.toLowerCase();
 return products.filter(p=>(category==="Todos"||p.cat===category)&&p.name.toLowerCase().includes(q));
}

function renderCategoriesBar(){
  const bar = document.getElementById("categoriesBar");
  const cats = ["Todos", ...categories];
  bar.innerHTML = cats.map(c => `
    <button class="${category===c?'active':''}" onclick="setCat('${c}',this)">${c}</button>
  `).join("");
}

function render(){
 renderCategoriesBar();
 document.getElementById("homeGrid").innerHTML=products.slice(0,4).map(card).join("");
 document.getElementById("catalogGrid").innerHTML=filtered().map(card).join("")||`<div class="empty">Nenhum produto encontrado.</div>`;
 document.getElementById("promoGrid").innerHTML=products.filter(p=>p.promo).map(card).join("");
 renderCart();
 document.getElementById("cartBadge").textContent=cart.reduce((s,x)=>s+x.qty,0);
}

function setCat(c,el){category=c;renderCategoriesBar();render()}

function showPage(id,el){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));
 el.classList.add("active");
 if(id==="cart")renderCart();
 window.scrollTo(0,0);
}

function addCart(event, id){
 if(event) event.preventDefault();
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++; else cart.push({id,qty:1});
 saveCart(); 
 showNotification("Produto adicionado ao carrinho! 🛒");
}

function saveCart(){localStorage.setItem("jujuchinelos_cart",JSON.stringify(cart));render()}

function changeQty(id,n){
 const item=cart.find(x=>x.id===id); if(!item)return;
 item.qty+=n;if(item.qty<=0)cart=cart.filter(x=>x.id!==id);saveCart();
}

function renderCart(){
 const box=document.getElementById("cartContent");
 if(!cart.length){box.innerHTML='<div class="empty">Seu carrinho está vazio.<br>Escolha seus produtos no catálogo. 🛍️</div>';return}
 let total=0;
 box.innerHTML=cart.map(x=>{
  const p=products.find(y=>y.id===x.id); 
  if(!p) return "";
  total+=p.price*x.qty;
  return `<div class="cart-row"><div class="cart-thumb">Produto</div><div><b>${p.name}</b><br>${money(p.price)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${p.id},1)">+</button></div></div>`;
 }).join("")+`<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="full" onclick="checkout()">Finalizar compra</button>`;
}

function closeModal(){document.getElementById("productModal").classList.remove("show")}

function checkout(){
 if(!cart.length)return;
 const total=cart.reduce((s,x)=>{
   const p = products.find(p=>p.id===x.id);
   return s + (p ? p.price*x.qty : 0);
 },0);
 document.getElementById("productDetail").innerHTML=`
 <h2>Finalizar pedido</h2>
 <div class="form">
 <input id="clientName" placeholder="Seu nome">
 <input id="clientPhone" placeholder="Seu telefone">
 <input id="clientAddress" placeholder="Endereço ou retirada">
 <select id="payment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select>
 </div>
 <p style="margin-top:12px">Total do pedido: <b>${money(total)}</b></p>
 <button class="full" onclick="confirmOrder()">Confirmar e Enviar para o WhatsApp</button>`;
 document.getElementById("productModal").classList.add("show");
}

function confirmOrder(){
 const name=document.getElementById("clientName").value.trim();
 if(!name){showNotification("Digite seu nome para continuar.");return}
 const lines=cart.map(x=>{const p=products.find(y=>y.id===x.id);return p ? `${x.qty}x ${p.name} - ${money(p.price*x.qty)}` : ''}).join("\n");
 const total=cart.reduce((s,x)=>{const p=products.find(p=>p.id===x.id); return s + (p ? p.price*x.qty : 0)},0);
 const text=`Olá! Quero fazer um pedido na Jujuchinelos.\n\nCliente: ${name}\nTelefone: ${document.getElementById("clientPhone").value}\nEndereço/retirada: ${document.getElementById("clientAddress").value}\nPagamento: ${document.getElementById("payment").value}\n\n${lines}\n\nTotal: ${money(total)}`;
 openWhatsAppDirectly(text);
}

/* FUNCIONALIDADES ADMIN */
function loginAdmin(){
  const pass = document.getElementById("adminPass").value;
  if(pass === ADMIN_PASSWORD){
    isAdminLoggedIn = true;
    document.getElementById("adminLoginView").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    document.getElementById("storePhoneInput").value = storePhone;
    renderAdminList();
    showNotification("Painel carregado com sucesso!");
  } else {
    showNotification("Senha incorreta!");
  }
}

function renderAdminList(){
  const list = document.getElementById("adminProductList");
  list.innerHTML = products.map(p=>`
    <div class="admin-card">
      <div>
        <b>${p.name}</b> (${p.cat})<br>
        <span style="color:#d45d9b;font-weight:bold">${money(p.price)}</span>
        ${p.promo ? `<small style="color:green"> (Promoção)</small>` : ''}
      </div>
      <div class="admin-actions">
        <button class="btn-edit" onclick="openEditProductModal(${p.id})">Editar</button>
        <button class="btn-danger" onclick="deleteProduct(${p.id})">Excluir</button>
      </div>
    </div>
  `).join("");
}

function deleteProduct(id){
  if(confirm("Tem certeza que deseja excluir este produto?")){
    products = products.filter(p => p.id !== id);
    saveProducts();
    showNotification("Produto excluído!");
  }
}

function handleImageUpload(inputEl){
  const file = inputEl.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(e){
      currentImageData = e.target.result;
      const preview = document.getElementById("imgPreview");
      preview.src = currentImageData;
      preview.style.display = "block";
    };
    reader.readAsDataURL(file);
  }
}

function getCategoryOptionsHTML(selectedCat=""){
  return categories.map(c => `<option value="${c}" ${c===selectedCat?'selected':''}>${c}</option>`).join("");
}

function openAddProductModal(){
  currentImageData = "";
  document.getElementById("productDetail").innerHTML = `
    2>Adicionar Produto</h2>
    <div class="form">
      <input id="newPName" placeholder="Nome do produto">
      <select id="newPCat">${getCategoryOptionsHTML()}</select>
      <input id="newPPrice" type="number" step="0.01" placeholder="Preço (R$)">
      
      <label style="font-size:13px;color:#806875;margin-top:5px;display:block">📷 Imagem do Produto:</label>
      <input type="file" accept="image/*" onchange="handleImageUpload(this)" style="padding:8px">
      <input id="newPImg" placeholder="Ou cole a URL da imagem aqui" oninput="currentImageData=this.value;document.getElementById('imgPreview').src=this.value;document.getElementById('imgPreview').style.display='block'">
      <img id="imgPreview" class="preview-img" alt="Prévia">

      <label class="checkbox-label">
        <input type="checkbox" id="newPPromo" onchange="document.getElementById('oldPriceBox').style.display = this.checked ? 'block' : 'none'"> Produto em Promoção?
      </label>
      <div id="oldPriceBox" style="display:none">
        <input id="newPOldPrice" type="number" step="0.01" placeholder="Preço Antigo (R$)">
      </div>
    </div>
    <button class="full" onclick="saveNewProduct()">Salvar Produto</button>
  `;
  document.getElementById("productModal").classList.add("show");
}

function saveNewProduct(){
  const name = document.getElementById("newPName").value.trim();
  const cat = document.getElementById("newPCat").value;
  const price = parseFloat(document.getElementById("newPPrice").value);
  const isPromo = document.getElementById("newPPromo").checked;
  const oldPrice = parseFloat(document.getElementById("newPOldPrice")?.value || 0);

  if(!name || isNaN(price)){
    showNotification("Preencha o nome e o preço.");
    return;
  }

  const newProd = {
    id: Date.now(),
    name: name,
    cat: cat,
    price: price,
    img: currentImageData,
    promo: isPromo,
    old: isPromo ? oldPrice : undefined
  };

  products.push(newProd);
  saveProducts();
  closeModal();
  showNotification("Produto adicionado com sucesso! ✨");
}

function openEditProductModal(id){
  const p = products.find(x => x.id === id);
  if(!p) return;

  currentImageData = p.img || "";

  document.getElementById("productDetail").innerHTML = `
    <h2>Editar Produto</h2>
    <div class="form">
      <input id="editPName" value="${p.name}" placeholder="Nome do produto">
      <select id="editPCat">${getCategoryOptionsHTML(p.cat)}</select>
      <input id="editPPrice" type="number" step="0.01" value="${p.price}" placeholder="Preço (R$)">
      
      <label style="font-size:13px;color:#806875;margin-top:5px;display:block">📷 Imagem do Produto:</label>
      <input type="file" accept="image/*" onchange="handleImageUpload(this)" style="padding:8px">
      <input id="editPImg" value="${p.img || ''}" placeholder="Ou cole a URL da imagem aqui" oninput="currentImageData=this.value;document.getElementById('imgPreview').src=this.value;document.getElementById('imgPreview').style.display='block'">
      <img id="imgPreview" class="preview-img" src="${p.img || ''}" style="${p.img ? 'display:block' : 'display:none'}" alt="Prévia">

      <label class="checkbox-label">
        <input type="checkbox" id="editPPromo" ${p.promo ? 'checked' : ''} onchange="document.getElementById('editOldPriceBox').style.display = this.checked ? 'block' : 'none'"> Produto em Promoção?
      </label>
      <div id="editOldPriceBox" style="display:${p.promo ? 'block' : 'none'}">
        <input id="editPOldPrice" type="number" step="0.01" value="${p.old || ''}" placeholder="Preço Antigo (R$)">
      </div>
    </div>
    <button class="full" onclick="saveEditedProduct(${p.id})">Salvar Alterações</button>
  `;
  document.getElementById("productModal").classList.add("show");
}

function saveEditedProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;

  const name = document.getElementById("editPName").value.trim();
  const cat = document.getElementById("editPCat").value;
  const price = parseFloat(document.getElementById("editPPrice").value);
  const isPromo = document.getElementById("editPPromo").checked;
  const oldPrice = parseFloat(document.getElementById("editPOldPrice")?.value || 0);

  if(!name || isNaN(price)){
    showNotification("Preencha o nome e o preço.");
    return;
  }

  p.name = name;
  p.cat = cat;
  p.price = price;
  p.img = currentImageData;
  p.promo = isPromo;
  p.old = isPromo ? oldPrice : undefined;

  saveProducts();
  closeModal();
  showNotification("Produto atualizado! 👍");
}

function openManageCategoriesModal(){
  document.getElementById("productDetail").innerHTML = `
    <h2>Gerenciar Categorias</h2>
    <div style="margin:15px 0" id="tagsList">
      ${categories.map(c => `<span class="tag-item">${c} <button onclick="deleteCategory('${c}')">✕</button></span>`).join("")}
    </div>
    <div class="form">
      <input id="newCatName" placeholder="Nome da nova categoria">
    </div>
    <button class="full" onclick="addNewCategory()">+ Adicionar Categoria</button>
  `;
  document.getElementById("productModal").classList.add("show");
}

function addNewCategory(){
  const input = document.getElementById("newCatName");
  const val = input.value.trim();
  if(!val){
    showNotification("Digite a categoria.");
    return;
  }
  if(categories.includes(val)){
    showNotification("Categoria já existe.");
    return;
  }
  categories.push(val);
  saveCategories();
  openManageCategoriesModal();
  showNotification("Categoria adicionada!");
}

function deleteCategory(catName){
  if(confirm(`Deseja remover a categoria "${catName}"?`)){
    categories = categories.filter(c => c !== catName);
    saveCategories();
    openManageCategoriesModal();
    showNotification("Categoria removida!");
  }
}

render();
</script>
</body>
</html>
